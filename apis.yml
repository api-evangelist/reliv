name: Reliv
description: >-
  Reliv is a digital medical ecosystem operating in Ecuador and Mexico that aims
  to simplify healthcare management for clinics, hospitals, doctors, and patients.
  Its platform combines a Hospital Information System (HIS) for hospital and clinic
  operations, an Electronic Health Record (EHR) offering digital clinical histories
  with online scheduling and electronic prescriptions, and a patient-facing
  Pacientes mobile app for appointments, digital prescriptions, and offers. Reliv
  positions itself as the first integrated digital medical ecosystem of Ecuador and
  runs a Reliv Academy training platform. Surfaced as a 500 Global portfolio company
  and added to the API Evangelist network as a lead; no public API, developer portal,
  or documentation surface was found during enrichment.
